<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VíaSegura | Incidentes</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- ==================== HEADER ==================== -->
    <header class="site-header">
        <nav class="nav container">

            <!-- Logo / Marca -->
            <a class="brand" href="index.html">
                <span class="brand-mark">VS</span>
                <span>VíaSegura</span>
            </a>

            <!-- Navegación principal -->
            <div class="links">
                <a href="index.html">Inicio</a>
                <a href="reportar.html">Reportar</a>
                <a class="active" href="incidentes.html">Incidentes</a>
                <a href="estadisticas.html">Estadísticas</a>
            </div>

        </nav>
    </header>


    <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
    <main>

        <!-- Encabezado de la página -->
        <section class="page-heading">
            <div class="container">

                <span class="eyebrow">REGISTROS</span>

                <h1>Incidentes reportados</h1>

                <p>
                    Consulta los reportes almacenados y filtra
                    la información que necesitas.
                </p>

            </div>
        </section>


        <!-- ==================== LISTADO DE INCIDENTES ==================== -->
        <section class="section compact">
            <div class="container">

                <!-- Barra de herramientas -->
                <div class="toolbar">

                    <!-- Buscador -->
                    <div class="search-wrap">
                        <span>⌕</span>

                        <input
                            id="search"
                            type="search"
                            placeholder="Buscar por ubicación, municipio, tipo o factor..."
                        >
                    </div>


                    <!-- Filtro por tipo -->
                    <select id="filterType">
                        <option value="">Todos los tipos</option>
                        <option>Colisión</option>
                        <option>Atropello</option>
                        <option>Caída de motociclista</option>
                        <option>Choque con objeto</option>
                        <option>Otro</option>
                    </select>

                </div>


                <!-- Información de resultados -->
                <div class="results-meta">

                    <span id="resultCount">
                        0 reportes
                    </span>

                    <a class="text-link" href="reportar.html">
                        + Nuevo reporte
                    </a>

                </div>


                <!-- Lista dinámica de incidentes -->
                <div
                    id="incidentList"
                    class="incident-list">
                </div>

            </div>
        </section>

    </main>


    <!-- ==================== FOOTER ==================== -->
    <footer>
        <div class="container footer-inner">

            <strong>VíaSegura</strong>

            <span>
                Proyecto académico de aplicación web para seguridad vial.
            </span>

        </div>
    </footer>


    <!-- ==================== JAVASCRIPT ==================== -->
    <script src="js/app.js"></script>

</body>

</html>
